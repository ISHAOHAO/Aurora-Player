<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark"><!-- 播放页恒暗：观影场景不随主题切换（规范 v1.2 §2.5） -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Player — 播放页原型</title>
<link rel="stylesheet" href="aurora.css">
<style>
  /* ===== 模拟视频画面（低饱和夜景电影帧，非模板渐变） ===== */
  .video-stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(55% 45% at 66% 30%, rgba(150,130,100,.18) 0%, transparent 55%),
      radial-gradient(90% 80% at 30% 75%, rgba(60,70,85,.25) 0%, transparent 60%),
      linear-gradient(165deg, #14171c 0%, #07080a 80%);
  }
  .video-stage::before {  /* 远景剪影，模拟电影构图 */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
    background: linear-gradient(180deg, transparent 0%, rgba(3,4,6,.85) 65%),
      radial-gradient(45% 90% at 25% 100%, rgba(8,9,11,.9) 0%, transparent 70%);
  }
  .video-stage::after {   /* 上下遮幅（2.35:1 电影感） */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.92) 0%, transparent 11%, transparent 89%, rgba(0,0,0,.92) 100%);
  }

  /* 字幕示例 */
  .subtitle {
    position: fixed; left: 50%; bottom: 15%; transform: translateX(-50%);
    z-index: 3; text-align: center;
    font-size: 26px; font-weight: 500; color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9);
    pointer-events: none;
  }
  .subtitle small { display: block; font-size: 15px; color: rgba(255,255,255,.75); margin-top: 4px; }

  /* ===== 顶部信息条（鼠标移至顶部触发，原型中常驻展示） ===== */
  .top-info {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px;
    padding: 18px 32px 40px;
    background: linear-gradient(180deg, rgba(0,0,0,.65) 0%, transparent 100%);
  }
  .casting-badge {
    display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 14px;
    border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: .06em;
    color: var(--text-secondary);
  }
  .casting-badge .live {
    width: 6px; height: 6px; border-radius: 999px; background: #E8B06A;
  }
  .top-info .title { font-size: 15px; font-weight: 600; }
  .top-info .specs { font-size: 12px; color: var(--text-secondary); }
  .top-info .spacer { flex: 1; }

  /* ===== 底部控制层（Glass-1，距边缘 24px，圆角 16px） ===== */
  .control-deck {
    position: fixed; left: 24px; right: 24px; bottom: 24px; z-index: 5;
    border-radius: var(--radius-panel);
    padding: 14px 20px 12px;
    box-shadow: 0 18px 48px rgba(0,0,0,.5), 0 0 0 1px var(--glass-border);
  }

  /* 进度条区 */
  .seek-zone { position: relative; padding: 6px 0 10px; }
  .seekbar {
    position: relative; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,.18);
    cursor: pointer;
    transition: height var(--dur-fast) var(--ease-out);
  }
  .seek-zone:hover .seekbar { height: 8px; }
  .seekbar .buffered {
    position: absolute; inset: 0 auto 0 0; width: 71%;
    border-radius: 999px; background: rgba(255,255,255,.3);
  }
  .seekbar .played {
    position: absolute; inset: 0 auto 0 0; width: 46.3%;
    border-radius: 999px; background: var(--accent);
  }
  .seekbar .knob {
    position: absolute; top: 50%; left: 46.3%;
    width: 12px; height: 12px; border-radius: 999px;
    background: #fff; transform: translate(-50%, -50%);
    box-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  /* 章节标记点 */
  .chapter-dot {
    position: absolute; top: 50%; width: 4px; height: 4px;
    border-radius: 999px; background: rgba(255,255,255,.55);
    transform: translate(-50%, -50%);
  }
  /* 缩略图气泡 */
  .thumb-pop {
    position: absolute; bottom: 26px; left: 46.3%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px; border-radius: 10px;
  }
  .thumb-pop .thumb {
    width: 160px; height: 90px; border-radius: 6px;
    background:
      radial-gradient(55% 50% at 62% 28%, rgba(150,130,100,.2) 0%, transparent 55%),
      linear-gradient(160deg, #16181d 0%, #08090b 100%);
    border: 1px solid rgba(255,255,255,.1);
  }
  .thumb-pop .t { font-size: 12px; color: var(--text-secondary); }
  .thumb-pop .ch { font-size: 11px; color: var(--text-muted); }

  /* 控制行 */
  .controls-row {
    display: flex; align-items: center; gap: 4px;
  }
  .controls-row .group { display: flex; align-items: center; gap: 2px; }
  .controls-row .time {
    margin: 0 14px;
    font-size: 13px; color: var(--text-secondary);
  }
  .controls-row .time b { color: var(--text-primary); font-weight: 500; }
  .controls-row .right { margin-left: auto; display: flex; align-items: center; gap: 2px; }

  .primary-btn {
    width: 46px; height: 46px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.18);
    color: #fff;
    transition: all var(--dur-fast) var(--ease-out);
  }
  .primary-btn:hover { background: rgba(255,255,255,.2); }
  .primary-btn:active { transform: scale(.94); }
  .primary-btn svg { width: 22px; height: 22px; }

  /* 音量 */
  .volume { display: flex; align-items: center; gap: 6px; margin-left: 6px; }
  .vol-track {
    width: 88px; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,.18); position: relative; cursor: pointer;
  }
  .vol-track i {
    position: absolute; inset: 0 auto 0 0; width: 65%;
    border-radius: 999px; background: rgba(255,255,255,.85);
  }

  .label-btn {
    height: 32px; padding: 0 12px;
    border-radius: var(--radius-ctrl);
    font-size: 12px; font-weight: 600; letter-spacing: .03em;
    color: var(--text-secondary);
    display: inline-flex; align-items: center; gap: 6px;
    transition: all var(--dur-fast) var(--ease-out);
  }
  .label-btn:hover { background: rgba(255,255,255,.08); color: var(--text-primary); }
  .label-btn.on { color: var(--text-primary); }
  .label-btn svg { width: 16px; height: 16px; }

  .hdr-tag {
    height: 22px; padding: 0 8px; margin-right: 4px;
    display: inline-flex; align-items: center;
    border-radius: 6px; font-size: 11px; font-weight: 600;
    color: var(--text-secondary);
    border: 1px solid rgba(255,255,255,.14);
  }
</style>
</head>
<body>

<nav class="proto-nav glass-2">
  <a href="home.html">首页</a>
  <a href="player.html" class="active">播放页</a>
</nav>

<div class="video-stage"></div>

<div class="subtitle">
  我们曾经仰望星空，思考我们在宇宙中的位置
  <small>We used to look up at the sky and wonder at our place in the stars.</small>
</div>

<!-- 顶部信息条 -->
<div class="top-info">
  <div class="casting-badge glass-1"><div class="live"></div>CASTING · iPhone 15 Pro</div>
  <div class="title">星际穿越 Interstellar.2014.2160p.BluRay.Remux.mkv</div>
  <div class="specs timecode">HEVC · 4K 10bit · HDR10 · BT.2020 · 23.976</div>
  <div class="spacer"></div>
  <button class="icon-btn" title="播放列表">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
  </button>
  <button class="icon-btn" title="关闭">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
</div>

<!-- 底部控制层 -->
<div class="control-deck glass-1">

  <!-- 进度条 -->
  <div class="seek-zone">
    <div class="thumb-pop glass-2">
      <div class="thumb"></div>
      <div class="t timecode">01:06:53 / 02:49:04</div>
      <div class="ch">第 7 章 · 虫洞</div>
    </div>
    <div class="seekbar">
      <div class="buffered"></div>
      <div class="played"></div>
      <div class="chapter-dot" style="left:8%"></div>
      <div class="chapter-dot" style="left:22%"></div>
      <div class="chapter-dot" style="left:38%"></div>
      <div class="chapter-dot" style="left:57%"></div>
      <div class="chapter-dot" style="left:74%"></div>
      <div class="chapter-dot" style="left:90%"></div>
      <div class="knob"></div>
    </div>
  </div>

  <!-- 控制行 -->
  <div class="controls-row">
    <div class="group">
      <button class="icon-btn" title="上一个">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5.9v12.2c0 .8-.9 1.3-1.6.9L8.6 13a1.05 1.05 0 0 1 0-1.8l9.8-6.2c.7-.4 1.6.1 1.6.9z"/></svg>
      </button>
      <button class="icon-btn" title="快退 10 秒">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
      <button class="primary-btn" title="播放/暂停">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
      <button class="icon-btn" title="快进 10 秒">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 7l5 5-5 5M6 7l5 5-5 5"/></svg>
      </button>
      <button class="icon-btn" title="下一个">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.9v12.2c0 .8.9 1.3 1.6.9l9.8-6.1a1.05 1.05 0 0 0 0-1.8L5.6 5c-.7-.4-1.6.1-1.6.9z"/></svg>
      </button>
    </div>

    <div class="time timecode"><b>01:06:53</b> / 02:49:04</div>

    <div class="volume">
      <button class="icon-btn" title="静音 (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>
      </button>
      <div class="vol-track"><i></i></div>
    </div>

    <div class="right">
      <span class="hdr-tag">HDR10</span>
      <button class="label-btn on" title="字幕 (S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 14h4M12 14h6M6 17h2M10 17h4"/></svg>
        简中
      </button>
      <button class="label-btn" title="音轨 (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V6l12-2v11"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="18.5" cy="15" r="2.5"/></svg>
        TrueHD 7.1
      </button>
      <button class="label-btn" title="画质">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 8.7l5.4-.8L12 3z"/></svg>
        高画质
      </button>
      <button class="icon-btn" title="控制台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2.2"/><circle cx="8" cy="16" r="2.2"/></svg>
      </button>
      <button class="icon-btn" title="全屏 (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </div>
</div>

</body>
</html>

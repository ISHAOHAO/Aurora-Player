<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Player — 首页原型</title>
<script>
  /* 主题初始化：localStorage 优先，否则跟随系统；写入 <html data-theme> 避免闪烁 */
  (function () {
    var saved = localStorage.getItem('aurora-theme');
    var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="aurora.css">
<style>
  .page {
    position: relative; z-index: 1;
    height: 100vh;
    display: flex; flex-direction: column;
    padding: 0 48px 32px;
    max-width: 1440px; margin: 0 auto;
  }

  /* ===== 顶栏（56px，页面内元素不用玻璃，底部分隔线） ===== */
  .topbar {
    height: 56px; margin: 0 -48px 28px; padding: 0 48px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .logo {
    display: flex; align-items: center; gap: 9px;
    font-size: 17px; font-weight: 600; letter-spacing: .02em;
  }
  .logo svg { width: 15px; height: 15px; color: var(--text-primary); }
  .search {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    width: 260px; height: 36px; padding: 0 14px;
    border-radius: var(--radius-ctrl);
    background: var(--surface-2);
    color: var(--text-muted); font-size: 13px;
    transition: background var(--dur-fast) var(--ease-out);
  }
  .search:hover { background: var(--surface-hover); }
  .dlna-badge { display: flex; align-items: center; gap: 8px; }
  .dlna-badge .dot {
    width: 6px; height: 6px; border-radius: 999px; background: #46A758;
  }
  .dlna-badge span { font-size: 12px; color: var(--text-secondary); }

  /* ===== Hero：继续播放 ===== */
  .hero { display: flex; gap: 32px; align-items: flex-end; margin-bottom: 36px; }
  .hero-card {
    position: relative;
    width: 460px; aspect-ratio: 16/9;
    border-radius: var(--radius-card);
    overflow: hidden; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    transition: transform var(--dur-normal) var(--ease-out);
    flex-shrink: 0;
  }
  .hero-card:hover { transform: scale(1.02); }
  /* 哑光伪电影帧：低饱和、带明暗构图，非模板渐变 */
  .hero-card .art {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, transparent 52%, rgba(0,0,0,.6) 100%),
      radial-gradient(110% 75% at 72% 18%, rgba(88,96,110,.4) 0%, transparent 55%),
      linear-gradient(165deg, #1b1e23 0%, #0a0b0e 100%);
    transition: transform var(--dur-normal) var(--ease-out);
  }
  .hero-card:hover .art { transform: scale(1.03); }
  .hero-card .play-fab {
    position: absolute; inset: 0; margin: auto;
    width: 64px; height: 64px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.25);
    opacity: 0; transform: scale(.9);
    transition: all var(--dur-normal) var(--ease-out);
  }
  .hero-card:hover .play-fab { opacity: 1; transform: scale(1); }
  .hero-card .play-fab svg { width: 26px; height: 26px; color: #fff; margin-left: 3px; }
  .hero-card .progress {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: rgba(255,255,255,.15);
  }
  .hero-card .progress i {
    display: block; height: 100%; width: 64%;
    background: var(--accent);
  }
  .hero-meta .kicker { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .hero-meta h1 { font-size: 34px; font-weight: 600; line-height: 1.2; margin-bottom: 10px; }
  .hero-meta .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
  .resume-btn {
    display: inline-flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 26px;
    border-radius: 999px;
    background: var(--btn-primary-bg); color: var(--btn-primary-fg);
    font-size: 14px; font-weight: 600;
    transition: opacity var(--dur-fast) var(--ease-out);
  }
  .resume-btn:hover { opacity: .85; }
  .resume-btn svg { width: 16px; height: 16px; }

  /* ===== 快捷入口（哑光实色磁贴，非玻璃） ===== */
  .shortcuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 36px; }
  .tile {
    height: 88px; border-radius: var(--radius-card);
    display: flex; align-items: center; gap: 14px;
    padding: 0 20px;
    background: var(--surface-1);
    border: 1px solid var(--hairline);
    color: var(--text-primary); font-size: 15px; font-weight: 500;
    transition: background var(--dur-fast) var(--ease-out);
  }
  .tile:hover { background: var(--surface-hover); }
  .tile svg { width: 24px; height: 24px; color: var(--text-secondary); }
  .tile small { display: block; font-size: 12px; color: var(--text-muted); font-weight: 400; }

  /* ===== 最近播放 ===== */
  .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .section-head h2 { font-size: 18px; font-weight: 600; }
  .section-head span { font-size: 12px; color: var(--text-muted); }
  .rail { display: flex; gap: 16px; overflow: hidden; }
  .poster {
    width: 168px; flex-shrink: 0; cursor: pointer;
    transition: transform var(--dur-fast) var(--ease-out);
  }
  .poster:hover { transform: translateY(-2px); }
  .poster .cover {
    position: relative; aspect-ratio: 2/3;
    border-radius: var(--radius-card); overflow: hidden;
    margin-bottom: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .poster .cover .tag {
    position: absolute; top: 8px; left: 8px;
    padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600;
    background: rgba(0,0,0,.6);
    color: rgba(255,255,255,.85);
  }
  .poster .cover .prog {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: rgba(255,255,255,.15);
  }
  .poster .cover .prog i { display: block; height: 100%; background: var(--accent); }
  .poster .name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .poster .info { font-size: 12px; color: var(--text-muted); }

  /* 海报艺术：哑光低饱和场景感（CSS 生成，占位居） */
  .art-1 { background: radial-gradient(90% 55% at 50% 0%, rgba(96,104,120,.35) 0%, transparent 60%), linear-gradient(170deg, #22262c 0%, #0d0e11 75%); }
  .art-2 { background: radial-gradient(80% 50% at 30% 20%, rgba(150,120,90,.22) 0%, transparent 60%), linear-gradient(170deg, #2a241e 0%, #100e0b 75%); }
  .art-3 { background: radial-gradient(90% 55% at 60% 15%, rgba(110,140,120,.22) 0%, transparent 60%), linear-gradient(170deg, #1e2622 0%, #0a0d0b 75%); }
  .art-4 { background: radial-gradient(85% 50% at 40% 10%, rgba(130,120,150,.22) 0%, transparent 60%), linear-gradient(170deg, #24222b 0%, #0e0d12 75%); }
  .art-5 { background: radial-gradient(80% 50% at 55% 20%, rgba(150,140,110,.2) 0%, transparent 60%), linear-gradient(170deg, #28251f 0%, #0f0e0c 75%); }
  .art-6 { background: radial-gradient(90% 55% at 50% 25%, rgba(100,115,135,.25) 0%, transparent 60%), linear-gradient(170deg, #1f232a 0%, #0b0d10 75%); }
</style>
</head>
<body>

<nav class="proto-nav glass-2">
  <a href="home.html" class="active">首页</a>
  <a href="player.html">播放页</a>
</nav>

<div class="ambient-stage"></div>

<div class="page">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.88l11-6.86a1.03 1.03 0 0 0 0-1.76l-11-6.86A1.03 1.03 0 0 0 8 5.14z"/></svg>
      Aurora
    </div>
    <div class="dlna-badge"><div class="dot"></div><span>DLNA 在线 · 王先生的影音室</span></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      搜索媒体库…
    </div>
    <button class="icon-btn theme-toggle" title="切换浅色/暗色" onclick="toggleTheme()">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <!-- Hero：继续播放 -->
  <section class="hero">
    <div class="hero-card">
      <div class="art"></div>
      <div class="play-fab">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.88l11-6.86a1.03 1.03 0 0 0 0-1.76l-11-6.86A1.03 1.03 0 0 0 8 5.14z"/></svg>
      </div>
      <div class="progress"><i></i></div>
    </div>
    <div class="hero-meta">
      <div class="kicker">继续观看</div>
      <h1>星际穿越</h1>
      <div class="sub timecode">4K · HDR10 · HEVC · 已看 64% · 剩余 52 分钟</div>
      <button class="resume-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.88l11-6.86a1.03 1.03 0 0 0 0-1.76l-11-6.86A1.03 1.03 0 0 0 8 5.14z"/></svg>
        从 01:47:22 继续
      </button>
    </div>
  </section>

  <!-- 快捷入口 -->
  <section class="shortcuts">
    <button class="tile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      <div>本地媒体<small>浏览文件与文件夹</small></div>
    </button>
    <button class="tile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.9 5.7 3.9 9S14.5 18.4 12 21c-2.5-2.6-3.9-5.7-3.9-9S9.5 5.6 12 3z"/></svg>
      <div>网络媒体<small>HTTP / HLS / 串流地址</small></div>
    </button>
    <button class="tile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12.55a11 11 0 0 1 14.08 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
      <div>DLNA 投屏<small>等待手机投放</small></div>
    </button>
    <button class="tile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="6" rx="2"/><rect x="2" y="11" width="20" height="6" rx="2"/><path d="M6 6h.01M6 14h.01M16 18l3 3m0-3l-3 3"/></svg>
      <div>NAS<small>SMB / WebDAV（即将上线）</small></div>
    </button>
  </section>

  <!-- 最近播放 -->
  <section>
    <div class="section-head"><h2>最近播放</h2><span>6 个项目</span></div>
    <div class="rail">
      <div class="poster"><div class="cover art-1"><span class="tag">4K HDR</span><div class="prog"><i style="width:64%"></i></div></div><div class="name">星际穿越</div><div class="info">电影 · 2014</div></div>
      <div class="poster"><div class="cover art-2"><span class="tag">1080p</span><div class="prog"><i style="width:31%"></i></div></div><div class="name">绝命毒师 S02E05</div><div class="info">剧集 · 续播 31%</div></div>
      <div class="poster"><div class="cover art-3"><span class="tag">4K</span><div class="prog"><i style="width:100%"></i></div></div><div class="name">地球脉动 III</div><div class="info">纪录片 · 已看完</div></div>
      <div class="poster"><div class="cover art-4"><span class="tag">1080p</span><div class="prog"><i style="width:12%"></i></div></div><div class="name">命运石之门 第14话</div><div class="info">动漫 · 续播 12%</div></div>
      <div class="poster"><div class="cover art-5"><span class="tag">Remux</span><div class="prog"><i style="width:88%"></i></div></div><div class="name">银翼杀手 2049</div><div class="info">电影 · 2017</div></div>
      <div class="poster"><div class="cover art-6"><span class="tag">LIVE</span></div><div class="name">跨年演唱会 2025</div><div class="info">演唱会</div></div>
    </div>
  </section>

</div>
<script>
  function toggleTheme() {
    var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('aurora-theme', next);
  }
</script>
</body>
</html>
